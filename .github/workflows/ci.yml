name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint and test
        run: make check

      - name: Build bundle
        run: VERSION=0.0.0-dev-${GITHUB_SHA::7} make app

      - name: Verify bundle
        run: make verify-app

      - uses: actions/upload-artifact@v7
        with:
          name: PingMenubar-dev-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
